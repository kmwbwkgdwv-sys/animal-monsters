<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#222}canvas{display:block}</style></head><body>
<canvas id="c"></canvas>
<script type="module">
import { Renderer, Scene, Camera, Node, initPrims, PRIM } from '../js/engine/gl3d.js';
import { Part, ell, cap, sph } from '../js/render/sculpt.js';
const W = 900, H = 600;
const R = new Renderer(document.getElementById('c'), { preserve: true }); R.setSize(W, H, 1);
initPrims();
const S = new Scene(); S.bg = [0.78, 0.88, 0.97]; S.fogNear = 500; S.fogFar = 900;
const g = new Node(PRIM.disc, { color: '#9bd884', mat: 'terrain', outline: 0 }); g.setScale(6); S.add(g);
const o = [0.95, 0.45, 0.2], c = [1, 0.85, 0.4];
const t0 = performance.now();
const body = new Part([
  ell([0, 0.75, 0.15], [0.36, 0.38, 0.42], o, { k: 0 }),
  ell([0, 0.68, -0.32], [0.32, 0.32, 0.36], o, { k: 0.18 }),
  cap([0, 0.85, 0.25], [0, 1.15, 0.45], 0.2, 0.16, o, { k: 0.12 }),
]);
body.paint(ell([0, 0.55, 0.2], [0.25, 0.25, 0.4]), c, 0.03);
const geo = body.mesh(0.035);
const t1 = performance.now();
const n = new Node(geo, { color: '#ffffff' }); S.add(n);
const C = new Camera(30); C.pos = [2.6, 2.2, 3.4]; C.target = [0, 0.75, 0];
R.render(S, C);
document.title = `mesh ${(t1 - t0).toFixed(1)}ms verts ${geo.data.length / 13} tris ${geo.count / 3}`;
console.log(document.title);
window.__done = true;
</script></body></html>
