<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#3a5ab0;display:flex;flex-wrap:wrap;gap:6px;padding:6px}img{width:180px;height:180px;background:#5a7ad0;border-radius:12px}</style></head><body>
<script type="module">
// 開発用：アイコン（顔写真）の写り方を確認  ?ids=1,2,3
import { portrait } from '../js/render/portrait.js';
const q = new URLSearchParams(location.search);
const ids = (q.get('ids') || '1,4,7,46,60,90,120,150,180,199,200,13').split(',').map(Number);
for (const id of ids) { const im = document.createElement('img'); im.src = portrait(id, false); document.body.appendChild(im); }
window.__done = true;
</script></body></html>
