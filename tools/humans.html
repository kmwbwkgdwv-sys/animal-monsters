<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#222}canvas{display:block}</style></head><body>
<canvas id="c"></canvas>
<script type="module">
// 開発用：人物を並べて確認するページ  ?state=walk&yaw=0.4
import { Renderer, Scene, Camera, Node, initPrims, PRIM } from '../js/engine/gl3d.js';
import { buildHuman, animateHuman, randomLook, defaultLook } from '../js/render/models.js';
import { LOOKS } from '../js/data/story.js';
import { mulberry32 } from '../js/engine/util.js';
const q = new URLSearchParams(location.search);
const looks = [defaultLook(), ...Object.values(LOOKS)];
for (let i = 0; i < 4; i++) looks.push(randomLook(mulberry32(i * 31 + 5)));
const n = +(q.get('n') || 12), off = +(q.get('off') || 0);
const list = looks.slice(off, off + n);
const cols = +(q.get('cols') || 6), rows = Math.ceil(list.length / cols);
const W = +(q.get('w') || 1600), H = +(q.get('h') || 900);
const cv = document.getElementById('c');
const R = new Renderer(cv, { preserve: true }); R.setSize(W, H, 1);
initPrims();
const cw = Math.floor(W / cols), ch = Math.floor(H / rows);
const gl = R.gl; gl.enable(gl.SCISSOR_TEST);
list.forEach((lk, i) => {
  const S = new Scene(); S.bg = [0.78, 0.88, 0.97]; S.fogNear = 500; S.fogFar = 900;
  const g = new Node(PRIM.disc, { color: '#9bd884', mat: 'terrain', outline: 0 }); g.setScale(6); S.add(g);
  const Hm = buildHuman(lk); Hm.root.rot[1] = +(q.get('yaw') || 0.4); S.add(Hm.root);
  animateHuman(Hm, +(q.get('t') || 0.3), q.get('state') || 'idle');
  const C = new Camera(30); const d = +(q.get('d') || 5.2);
  C.pos = [0, 1.6 + d * 0.12, d]; C.target = [0, 1.05, 0];
  const x = (i % cols) * cw, y = H - (Math.floor(i / cols) + 1) * ch;
  gl.scissor(x, y, cw, ch);
  R.render(S, C, [x, y, cw, ch]);
});
window.__done = true;
</script></body></html>
