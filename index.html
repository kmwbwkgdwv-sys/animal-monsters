<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14213d">
<meta name="description" content="アニマルモンスター — 異世界の動物『アニモン』と旅する3Dアドベンチャー">
<title>アニマルモンスター</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <div id="labels"></div>
  <div id="hud" class="hidden">
    <div id="objective"><div class="ch"></div><div class="txt"></div><div class="quest"></div></div>
    <div id="hudRight">
      <div id="money">¥0</div>
      <button id="btnCam" class="hbtn" aria-label="視点を戻す" title="視点を戻す（C）"><span class="needle"><i></i></span></button>
      <button id="btnMap" class="hbtn" aria-label="マップ">🗺️</button>
      <button id="btnMenu" class="hbtn" aria-label="メニュー">☰</button>
    </div>
    <div id="regionName"></div>
    <div id="prompt"></div>
  </div>
  <div id="touch" class="hidden">
    <div id="stick"><div id="knob"></div></div>
    <div id="tbtns">
      <button id="tA" class="tbtn">A</button>
      <button id="tB" class="tbtn">B<small>ダッシュ</small></button>
      <button id="tRide" class="tbtn small">ライド</button>
    </div>
  </div>
  <div id="screens"></div>
  <div id="letterbox"><div class="lt"></div><div class="lb"></div></div>
  <div id="narr"><div class="nin"><div class="pics"></div><div class="t"></div></div></div>
  <div id="dialog" class="hidden"><div class="name"></div><div class="text"></div><div class="next">▼</div></div>
  <button id="skipBtn" class="hidden">スキップ ▶▶</button>
  <div id="fade"></div>
  <div id="flash"></div>
  <div id="toast"></div>
</div>
<div id="rotate"><div><div class="ico">📱</div>スマホを横向きにしてプレイしてください</div></div>
<div id="loading"><div class="logo">アニマルモンスター</div><div class="bar"><i></i></div><div class="msg">読み込み中…</div></div>
<noscript>このゲームを遊ぶにはJavaScriptを有効にしてください。</noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
